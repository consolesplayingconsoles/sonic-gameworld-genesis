# Appended to RetroArch's own config when this port launches it, so this instance never
# shares ports with another session's (the Crazy Taxi sandbox drives 55355 and 55400).
network_cmd_enable = "true"
network_cmd_port = "55357"
network_remote_enable = "true"
network_remote_enable_user_p1 = "true"
network_remote_base_port = "55500"
